<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Office Utilities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1220"/>
      <stop offset="1" stop-color="#1c2140"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7cf0"/>
      <stop offset="1" stop-color="#12b5c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5b5bd6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b5bd6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96 96)" font-family="Inter, Segoe UI, sans-serif" fill="#f5f6fb">
    <g transform="translate(0 0)">
      <rect width="56" height="56" rx="14" fill="url(#brand)"/>
      <g transform="translate(12 12)" stroke="#0f1220" stroke-width="3" stroke-linejoin="round" fill="none">
        <path d="M4 10L16 4l12 6v12l-12 6-12-6zM16 16L4 10M16 16l12-6M16 16v12"/>
      </g>
      <text x="76" y="38" font-size="26" font-weight="620" letter-spacing="-0.02em">
        Office<tspan opacity="0.7" font-weight="440">Utilities</tspan>
      </text>
    </g>

    <text y="180" font-size="82" font-weight="700" letter-spacing="-0.035em">
      Office documents,
    </text>
    <text y="278" font-size="82" font-weight="700" letter-spacing="-0.035em" fill="url(#brand)">
      without the upload.
    </text>

    <text y="360" font-size="26" font-weight="400" fill="#c7cbe0" letter-spacing="-0.005em">
      94 browser tools for PDF, Word, Excel, PowerPoint, diagrams and files —
    </text>
    <text y="394" font-size="26" font-weight="400" fill="#c7cbe0" letter-spacing="-0.005em">
      running entirely in this tab. Your files never leave your computer.
    </text>

    <g transform="translate(0 460)" font-size="19" fill="#9aa2b4">
      <g>
        <circle cx="10" cy="-6" r="6" fill="#4bcd90"/>
        <text x="26" y="0">No uploads · no accounts · no servers</text>
      </g>
      <g transform="translate(490 0)">
        <circle cx="10" cy="-6" r="6" fill="#7c7cf0"/>
        <text x="26" y="0">Works offline once loaded</text>
      </g>
    </g>
  </g>
</svg>
